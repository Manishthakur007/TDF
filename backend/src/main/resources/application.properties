spring.application.name=foodblog-backend

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/foodblog_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${JWT_SECRET:foodblog_super_secret_jwt_key_2024_very_long_secret_do_not_share}
app.jwt.expiration=86400000

# Server
server.port=8080
server.error.include-message=always

# CORS
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
